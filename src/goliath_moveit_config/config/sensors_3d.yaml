sensors:
  - default_sensor
default_sensor:
  filtered_cloud_topic: ""
  max_range: 2.00
  max_update_rate: 30.00
  padding_offset: 2.0
  padding_scale: 2.0
  point_cloud_topic: zed/zed_node/point_cloud/could_registered
  point_subsample: 100
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
